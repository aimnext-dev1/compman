[project]
name = "compman"
version = "0.1.0"
description = "Docker Compose stack management CLI"
requires-python = ">=3.10"
dependencies = ["typer", "pyyaml", "boto3", "botocore"]

[project.scripts]
compman = "compman.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["compman*"]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["compman"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
