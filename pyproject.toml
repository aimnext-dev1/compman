[project]
name = "compman"
version = "0.1.0"
description = "Docker Compose stack management CLI"
requires-python = ">=3.10"
dependencies = ["typer", "pyyaml", "boto3", "botocore"]

[project.scripts]
compman = "compman.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["compman*"]
